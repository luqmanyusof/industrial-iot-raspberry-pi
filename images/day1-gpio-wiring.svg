<text x="764" y="387" font-size="12" fill="#3c4043">to pin 14 (GND), then let go</text>
<text x="445" y="384" font-size="13" font-weight="700" fill="#1a73e8" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">Door switch</text>
