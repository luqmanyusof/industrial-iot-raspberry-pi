<text x="96" y="420" font-size="12" font-weight="700" fill="#8e24aa" stroke="#ffffff" stroke-width="4" paint-order="stroke">GPIO27 (pin 13) → relay IN</text>
<rect x="30" y="456" width="920" height="52" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
<text x="48" y="478" font-size="14" font-weight="700" fill="#a50e0e">Inputs go to GND only. Never connect a GPIO pin to 5 V (pins 2 and 4): GPIO works at 3.3 V.</text>
<text x="48" y="497" font-size="13" fill="#a50e0e">Pin 2 (5 V) is only for the relay module’s VCC. No mains voltage in this lab.</text>
